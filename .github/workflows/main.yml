name: Create Glow for Facebook app

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "URL to the decrypted IPA file"
        default: ""
        required: true
        type: string
      display_name:
        description: "App Name"
        default: "facebook-shn"
        required: true
        type: string
      bundle_id:
        description: "BundleID"
        default: "com.facebook.Facebook"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.1.1
        with:
          submodules: recursive

      - name: Download and validate IPA
        run: |
          wget "${{ inputs.ipa_url }}" --no-verbose -O ${{ github.workspace }}/facebook.ipa
          file_type=$(file --mime-type -b ${{ github.workspace }}/facebook.ipa)
          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Validation failed: The downloaded file is not a valid IPA."
            exit 1
          fi

      - name: Install Dependencies & Theos
        run: |
          brew install make ldid
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip
          git clone --recursive https://github.com/theos/theos.git ${{ github.workspace }}/theos

      - name: Compile Shan Font Tweak
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          cd ${{ github.workspace }}
          make package FINALPACKAGE=1

      - name: Download Glow Tweak
        id: download_glow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api_url="https://api.github.com/repos/dayanch96/Glow/releases/latest"
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" "$api_url" > /dev/null
          response=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" "$api_url")
          tag_name=$(echo "$response" | jq -r '.tag_name')
          deb_url=$(echo "$response" | jq -r '.assets[0].browser_download_url')
          echo "GLOW_TAG=$tag_name" >> $GITHUB_ENV
          wget "$deb_url" --no-verbose -O ${{ github.workspace }}/glow_fb.deb

      - name: Inject Tweaks via Cyan
        run: |
          SHAN_DEB=$(find ${{ github.workspace }}/packages -name "*.deb" | head -n 1)
          cyan -i facebook.ipa -o Glow_FB_${{ env.GLOW_TAG }}.ipa -uwef glow_fb.deb "$SHAN_DEB" -n "${{ inputs.display_name }}" -b ${{ inputs.bundle_id }} -s

      - name: Bundle Pyidaungsu Asset, Update Info.plist & Resign
        run: |
          unzip -q Glow_FB_${{ env.GLOW_TAG }}.ipa -d tmp_payload
          APP_PATH=$(find tmp_payload/Payload -maxdepth 1 -name "*.app")
          
          # 1. Copy Pyidaungsu.ttf directly into bundle root
          cp -f ${{ github.workspace }}/Pyidaungsu.ttf "$APP_PATH/Pyidaungsu.ttf"

          # 2. Register font in Info.plist safely
          APP_PLIST="$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UIAppFonts array" "$APP_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIAppFonts:0 string Pyidaungsu.ttf" "$APP_PLIST" 2>/dev/null || true

          # 3. Clean up Swift dylibs
          find tmp_payload/Payload/ -name "libswift*.dylib" -print -delete
          
          # 4. Re-sign main binary with ldid
          ldid -S "$APP_PATH/Facebook" 2>/dev/null || true

          # 5. Repack final IPA
          cd tmp_payload
          zip -qr ../Glow_FB_${{ env.GLOW_TAG }}_patched.ipa Payload
          cd ..
          mv Glow_FB_${{ env.GLOW_TAG }}_patched.ipa Glow_FB_${{ env.GLOW_TAG }}.ipa

      - uses: softprops/action-gh-release@v2.0.1
        with:
          tag_name: glow-fb-${{ env.GLOW_TAG }}
          name: Glow_FB ${{ env.GLOW_TAG }}
          files: Glow_FB_${{ env.GLOW_TAG }}.ipa
          draft: true

      - name: Output Release URL
        run: |
          echo "::notice::Release available at: https://github.com/${{ github.repository }}/releases"
